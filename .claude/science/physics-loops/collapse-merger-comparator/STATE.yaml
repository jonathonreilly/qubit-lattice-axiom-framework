goal: >
  A coupled d=1 toy: energy parcels falling along the crowding-set clock
  gradient, depositing permanent records at rate kappa x activity x
  F(availability); records suppress clocks (constraint class). Block01:
  engine + validation (parcel conservation; attraction sign — parcels
  drift toward crowding; static-blob husk nucleation; seeded
  determinism). Block02: single-blob collapse — Jeans-like runaway,
  husk growth, interior saturation with capacity-capped density (no
  singularity), exterior asymptotic freeze, ossification curve, the
  frozen-star anatomy (husk + bound unrecorded parcels). Block03:
  merger — two blobs approach as energy wells; husks NEVER translate
  (exact); merger completes by BRIDGING (the between-region saturates
  first; final husk connected and contains the union); record/husk
  monotonicity as the area-theorem analog (exact); memory leg — a
  radiated parcel burst deposits a sparse permanent shell with a
  measured post-passage clock offset. Block04: close + handoff.
