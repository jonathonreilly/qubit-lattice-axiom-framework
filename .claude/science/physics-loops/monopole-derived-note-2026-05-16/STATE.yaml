  self-energy measurement)
target_claim_type: bounded_theorem

runtime_budget_minutes: 60
cycles_planned: 1
mode: run

active_route: |
  Rewrite docs/MONOPOLE_DERIVED_NOTE.md and the runner so that:
    - the alpha import is named explicitly, with its role (bridge import)
      and its impact on the headline (the prefactor c * beta scales linearly
      with beta = 1/(4*pi*alpha), so the c-coefficient is the closed lattice
      derivation and the beta-coefficient is bridge-imported)
    - Step 4 is reframed as a configuration check (verifying the constructed
      field carries the intended integer monopole charges with zero net
      charge, and that the BARE Wilson action of a Dirac-string-singular
      field is dominated by string artifacts rather than monopole self-energy)
      — NOT as a quantitative independent measurement of c
    - the headline statement is the lattice-derived shape
        M_mono = c_lat * beta * M_Pl, c_lat = G_lat(0) = 0.2527 (derived)
      with the numerical 1.43 M_Pl explicitly conditioned on the imported
      alpha_EM(M_Pl) value
    - a coupling-independent statement (M_mono ~ M_Planck in the
      perturbative-alpha band [30, 60] in alpha^{-1}) is kept as the
      bounded-support headline
  Constraint: no audit-data, no verdicts, single PR, no --no-verify.

