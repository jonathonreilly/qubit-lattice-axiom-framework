slug: monopole-derived-note-2026-05-16
goal_summary: |
  Close the missing derivation in docs/MONOPOLE_DERIVED_NOTE.md so a re-audit
  can land a coherent status. The auditor flagged two issues:
  (1) the headline M_mono = c * beta * M_Pl with c = G_lat(0) = 0.2527 and
      beta = 1/(4*pi*alpha_EM(M_Pl)) uses an externally imported
      alpha_EM^{-1}(M_Pl) ~ 72.1 from one-loop SM RG running. That makes the
      headline a chosen-scale numerical result, not a closed first-principles
      computation.
  (2) Step 4 (direct numerical self-energy on L = 6..12 lattices) returns
      Delta S of order hundreds and a derived M of order 400-700 M_Pl, which
      disagrees with the analytic 1.43 M_Pl by orders of magnitude.

target_status: bounded-support (with explicit alpha import label and a
