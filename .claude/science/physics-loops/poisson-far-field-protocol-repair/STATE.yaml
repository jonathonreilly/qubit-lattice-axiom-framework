direction_of_result: >
  POSITIVE on the physics, NEGATIVE on the diagnostic. This reverses the arc: the
  two prior cycles were demotions, and this one recovers the parent note's
  Bounded Claim 1 conclusion while sharpening why its own evidence never showed it.

strongest_result: >
  The parent note's beta diagnostic is INVERTED, not merely noisy. Under its own
  window (radii 2..N/2-3) on its own Dirichlet operators, the biharmonic rival
  scores beta = 1.005 at N=24 while Poisson scores 1.796. Under a far-field
  protocol the truth is the reverse: Poisson is exactly 1/r and biharmonic's
  potential is asymptotically CONSTANT (beta -> 0 like 26/N). The diagnostic
  assigns the Newtonian exponent to the operator with no decay at all. This
  retroactively explains why PR #5656 measured biharmonic as closer to the target.

second_result: >
  A window whose radii scale with the box converges to a WRONG value even on a
  boundary-free lattice: beta = 1.66 with 4*pi*r*G = 0.65, stable to <0.02 across
  three sizes. Worse than failing to converge - it looks trustworthy and is wrong.
  The parent note's window is exactly of this kind.

third_result: >
  Under a fixed window the operator far fields separate by order 1, not by the
  0.156 that #5656 measured: Poisson 1.13 -> 1, biharmonic -> 0, 1/r^2 exactly
  2.000000000, local no extended field, screened monotone 1.68 -> 9.74 in mu^2.
  So unscreened Poisson uniquely gives the Newtonian exponent and the parent
  note's operator-preference CONCLUSION holds.

fourth_result: >
  But it cannot be obtained self-consistently. Removing the per-layer
  normalization - the obvious repair - does NOT localize the source: RMS/N goes
  from 0.30 to 0.51 (worse) and total mass diverges from 4.19e6 to 1.38e20 over
  N=16..48. Neither branch supplies a fixed localized source.

vindicates_predecessor: >
  #5656 R16 refused to claim any rival was the better operator, on the grounds
  that the gap sat inside the finite-size budget. That refusal is now vindicated
  twice: #5662 S3 showed the ranking is extrapolation-dependent, and U5 shows the
  rival's field is flat so it was never better. Had R16 taken the stronger reading
  it would have been refuted by this cycle.

not_new_here: >
  Poisson's own 1/(4 pi r) asymptotic is LANDED repo content
  (LATTICE_GREENS_1_OVER_R_..., GRAVITY_LEADING_LATTICE_CORRECTION_...). U1 is a
  protocol CONTROL against it, labelled as such in the runner, the note, and its
  ledger row. The prior-art sweep caught this before the runner was written.

