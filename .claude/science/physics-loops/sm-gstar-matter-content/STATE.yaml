# --- Cycle 4 (2026-05-29): I12 nu_R thermal exclusion sharpened (the sharpest fork) ---
cycle4:
  science_branch: physics-loop/sm-gstar-i12-nur-thermal-fork-2026-05-29
  residual_attacked: I12 (nu_R thermal exclusion; the 106.75 vs 112 fork — the campaign's sharpest residual)
  files_touched:
    - docs/SM_GSTAR_I12_NUR_THERMAL_EXCLUSION_BOUNDED_NOTE_2026-05-29.md
    - scripts/frontier_sm_gstar_i12_nur_thermal_exclusion_2026_05_29.py
    - .claude/science/physics-loops/sm-gstar-matter-content/{NO_GO_LEDGER,HANDOFF,STATE}.{md,yaml}
  outcome: >
    nu_R = (1,1)_0 is a complete gauge singlet, so it equilibrates with the bath
    ONLY via its Dirac Yukawa to H.L, at rate Gamma ~ y_nu^2 T. Across the
    framework's RETAINED-no-go Dirac/seesaw fork
    (neutrino_lane4_dirac_seesaw_fork_no_go_note_2026-04-27, retained_no_go,
    live-ledger verified): (A) light-Dirac branch — the Yukawa implied by the
    empirical small m_nu (m_nu = y_nu <H>, <H>=174 GeV) is y_nu ~ 3e-13 (0.05 eV)
    to 6e-13 (0.1 eV), far below the thermalization threshold
    y_thr ~ sqrt(1.66 sqrt(g*) T / M_Pl) ~ 1.2e-8 at T=100 GeV (most lenient),
    so Gamma << H by >= 4 decades (>= 7-9 at leptogenesis T) -> nu_R never
    thermalizes -> EXCLUDED -> g_*=106.75; (B) heavy-Majorana/seesaw branch —
    M_R >> T_census so nu_R is not a light relativistic dof -> EXCLUDED ->
    g_*=106.75. The ONLY route to g_*=112 is (C) large-Yukawa Dirac (y_nu ~ O(1)),
    which gives m_nu = y_nu <H> ~ 174 GeV, EXCLUDED by the sub-eV empirical
    neutrino mass.
  empirical_input_named: small m_nu (atmospheric ~0.05 eV, cosmological sub-eV) is an ADMITTED EMPIRICAL OBSERVATION / comparator, NOT a framework derivation
  branch_table:
    light_Dirac: "y_nu ~ 1e-12 << y_thr -> nu_R does not thermalize -> EXCLUDED -> g_*=106.75"
    heavy_Majorana: "M_R >> T_census -> nu_R not a light dof -> EXCLUDED -> g_*=106.75"
    large_Yukawa_Dirac: "y_nu ~ O(1) -> thermalizes -> g_*=112, but m_nu ~ 174 GeV EXCLUDED by data"
  yukawa_incompatibility: "implied y_nu ~ 5.7e-13 (m_nu=0.1 eV) vs threshold y_thr ~ 1.2e-8 (T=100 GeV, most lenient); margin >= 4.3 decades (>= 7.8 at T=1e9 GeV); Gamma/H ~ 5.9e-10 << 1"
  gstar_106_75_robust: "YES — robust across BOTH admitted branches (light-Dirac, heavy-Majorana), conditioned on empirical small m_nu; 112 only in the empirically-excluded large-Yukawa branch"
  steelman_N7: "FOR 112: nu_R is a genuine framework field (16th Weyl) and a natural O(0.01-1) Yukawa (by analogy with charged-fermion Yukawas) would thermalize it. REBUTTED: sub-eV m_nu forces y_nu ~ 1e-12 (4-9 decades below threshold); an O(1) Yukawa gives m_nu ~ 174 GeV; the native Majorana lane is obstruction-dominated; the Dirac/seesaw fork is retained_no_go so the framework does not assert the large-Yukawa branch."
  trace_gate_classification: direct_blocker_closure / partially_resolves (I12 sharpened from assumed boundary condition to small-m_nu-conditioned, branch-independent)
  claim_type: bounded_theorem
  i12_outcome: partially_resolved (branch-independent nu_R exclusion conditioned on empirical small m_nu; NOT fully derived — uses the empirical m_nu, does not derive it)
  honest_ceiling: "converts 'nu_R exclusion (assumed boundary condition)' into 'nu_R exclusion follows from small m_nu across both framework branches'; does NOT fully derive I12 from first principles (uses empirical m_nu); framework does NOT pick Dirac vs Majorana"
  runner_result: PASS=66 FAIL=0
  review_findings: vocab_lint 0 violations; no docs/audit/ touched
  pr_status: opening (note + runner + loop pack ready; committing + pushing + gh pr create)
  remaining_gstar_residuals_after_cycle4: >
    R-POL (massless-vector 2-pol, gated on emergent-Lorentz repair in flight),
    R-SPIN (per-site spin-1/2, audited_conditional), neutral-singlet branch
    convention, I11 (high-T regime). I12 is now partially_resolved
    (branch-independent nu_R exclusion conditioned on empirical small m_nu); the
