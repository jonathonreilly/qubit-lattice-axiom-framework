# Canonical source of truth for the repo's process vocabulary.
#
# Reader's contract: this file defines every process label the audit lane,
# review-loop, physics-loop, and audit-loop write. It is consumed by
# `scripts/vocab_lint.py` (for drift detection + auto-correct) and will be
# consumed by `scripts/render_controlled_vocabulary.py` in Cleanup-1b (for
# regenerating CONTROLLED_VOCABULARY.md and KEY_TERMINOLOGY.md).
#
# Authoring rule: change this file by PR. CV.md and KEY_TERMINOLOGY.md are
# generated products of this YAML + scripts/templates/*.template; do not edit
# them directly. Run `python3 scripts/render_controlled_vocabulary.py` after
# changing this file or a template.
#
# Design provenance: docs/repo/VOCABULARY_HYGIENE_DESIGN.md.

schema_version: 1

# ---------------------------------------------------------------------------
# Layers (the Vocabulary Hierarchy in CV.md)
# ---------------------------------------------------------------------------
layers:
  - id: 0_front_door
    rendered_doc: docs/KEY_TERMINOLOGY.md
    governs: "Single-page A-Z index of every repo-canonical process term."
  - id: 1_framework_substantive
    source_of_truth:
      - docs/MINIMAL_AXIOMS_2026-06-29.md
      - docs/audit/data/axiom_premise_nodes.json
    governs: "Framework axioms and explicitly approved primitive premise nodes. Out of scope for this vocabulary."
  - id: 2_external_paper_text
    source_of_truth:
      - docs/ai_methodology/CANONICAL_FRAMING_PARAGRAPH_2026-04-25.md
      - docs/ai_methodology/AI_ACCOUNTABILITY_AND_DISCLOSURE_NOTE_2026-04-25.md
    governs: "Verbatim disclosure paragraphs for papers / preprints / talks."
  - id: 3_operational
    rendered_doc: docs/repo/CONTROLLED_VOCABULARY.md
    governs: "Operational vocabulary used inside the repo (this YAML's home layer)."
  - id: 4_methodology_framing
    source_of_truth: docs/AI_METHODOLOGY_NOTE_2026-04-25.md
    governs: "Curated front-door for the methodology lane."

# ---------------------------------------------------------------------------
# Scope tags (transferability taxonomy)
# ---------------------------------------------------------------------------
scope_tags:
  core_process:
    description: "Pure process labels transferable unchanged to other AI-built repos."
    examples: [unaudited, audit_in_progress, prose_status, prose_corrections]
    transferable: true
  audit_physics_process:
    description: "Verdicts on physics derivations encoding the AI-physics method."
    examples:
      - audited_renaming
      - audited_decoration
      - audited_numerical_match
      - load_bearing_step_class
      - repair_class
    transferable: true
    transfer_scope: "AI-physics repos facing the same generation failure modes."
  repo_physics_policy:
    description: "Policy on physics primitives; this repo only."
    examples:
      - "axiom naming policy"
      - "A_min definition"
      - "Axiom* prohibition"
    governing_doc: docs/audit/AXIOM_MINIMALITY_POLICY.md
    transferable: false
  paper_voice:
    description: "Paper-facing prose voice rules."
    governing_doc: docs/WRITING_VOICE_GUIDE_2026-04-25.md
    transferable: false
  topic_local:
    description: "Topic-specific physics wording (BMV, boundary-law, etc.)."
    home: "Per-topic notes; not in CV.md after Cleanup-2."
    transferable: false

# ---------------------------------------------------------------------------
# Term families (the substantive vocabulary)
# ---------------------------------------------------------------------------
term_families:

  claim_type:
    description: "What kind of object the auditor says the row is."
    authority: docs/audit/README.md
    scope_tag: audit_physics_process
    values:
      positive_theorem:
        definition: "Derived positive result."
      bounded_theorem:
        definition: "Theorem with named bounds / admissions."
      no_go:
        definition: "Negative-result theorem foreclosing a route."
      open_gate:
        definition: "Clean open gate; blocks retained propagation downstream."
      decoration:
        definition: "Algebraic consequence of a parent claim with no new physical content."
      meta:
        definition: "Non-claim infrastructure rows (audit-prep notes, synthesis catalogues, fix-records)."

  audit_status:
    description: "Auditor's verdict on the row."
    authority: docs/audit/README.md
    scope_tag: audit_physics_process
    values:
      unaudited:
        definition: "Row has not been audited yet."
      audit_in_progress:
        definition: "First clean audit recorded; awaiting cross-confirmation per FRESH_LOOK_REQUIREMENTS §4."
      audited_clean:
        definition: "Derivation closes from cited inputs with no hidden premise. Load-bearing step must be class (A), (C), or genuine (D) over independent retained inputs."
      audited_renaming:
        definition: "Load-bearing step is a definition (class (E)) or symbol-identity assertion (class (F)). Chain reduces to definition substitution, not derivation."
        catches: "AI-generation failure mode: defining a new symbol as a target ratio, then 'showing' it matches data by name substitution."
      audited_conditional:
        definition: "Closure conditional on an unaudited dependency, open gate, retained-pending-chain row, unratified bridge, or premise not closed by cited authorities. Requires repair-class prefix in notes_for_re_audit_if_any."
      audited_decoration:
        definition: "Exact algebraic corollary of a parent claim with no independent comparator, falsifiability, compression, or new physical content."
        catches: "AI-generation failure mode: mass-producing algebraic consequences of one upstream parameter choice and presenting each as a separate retained theorem."
      audited_failed:
        definition: "Chain is wrong, stale relative to the runner, mismatches the observable, contradicts dependencies, or does not close on its own terms."
      audited_numerical_match:
        definition: "Result depends on a tuned/calibrated input or chosen scale/value rather than a structural theorem. Load-bearing step is class (G)."
        catches: "AI-generation failure mode: presenting a tuned-input match as a derivation."

  effective_status:
    description: "Publication-facing status, pipeline-derived from claim_type × audit_status × dependency closure. Not auditor-set."
    authority: docs/audit/README.md
    scope_tag: audit_physics_process
    derived: true
    values:
      retained:
        definition: "claim_type=positive_theorem + audit_status=audited_clean + retained-grade deps."
      retained_no_go:
        definition: "claim_type=no_go + audit_status=audited_clean + retained-grade deps."
      retained_bounded:
        definition: "claim_type=bounded_theorem + audit_status=audited_clean + retained-grade deps."
      retained_pending_chain:
        definition: "Clean theorem/no-go/bounded whose upstream chain is not yet retained-grade. Does not propagate retained status."
      open_gate:
        definition: "Clean open gate. Blocks retained propagation."
      decoration_under_<parent>:
        definition: "Audited decoration boxed under a retained parent claim."
        pattern: true
      meta:
        definition: "Non-claim infrastructure row."
      audited_<failure_mode>:
        definition: "Terminal non-clean audit verdict on an active claim."
        pattern: true

  repair_class:
    description: "Required prefix in notes_for_re_audit_if_any for audited_conditional verdicts."
    authority: docs/audit/README.md
    scope_tag: audit_physics_process
    values:
      missing_dependency_edge:
        definition: "A needed source note or authority exists or is named, but is not wired as a direct dependency."
      dependency_not_retained:
        definition: "A direct dependency exists but is not retained-grade."
      missing_bridge_theorem:
        definition: "The claim needs a new theorem for a carrier, readout, unit map, boundary condition, sector choice, normalization, or observable bridge."
      scope_too_broad:
        definition: "A clean bounded core exists, but the current scope includes an unclosed extension."
      runner_artifact_issue:
        definition: "A runner, log, classifier, threshold, import, or pass/fail accounting blocks closure despite local scope."
      compute_required:
        definition: "Closure needs a completed long run, sliced runner, cached certificate, or independent derivation. Runner timeout alone is not evidence."
      other:
        definition: "None of the above fits; the note must state why."

  no_go_discipline_status:
    description: "Outcome of the mandatory structured N1-N8 stress test for negative boundaries."
    authority: docs/ai_methodology/skills/no-go-discipline/SKILL.md
    scope_tag: audit_physics_process
    values:
      PASS:
        definition: "Every required N1-N8 record closes with no unresolved item; eligible to support a clean negative verdict."
      FAIL:
        definition: "At least one required stress test remains open, incomplete, or mismatched; forbids audited_clean and requires an explicit demotion."

  no_go_demotion:
    description: "Required conservative disposition when no_go_discipline_status is FAIL."
    authority: docs/ai_methodology/skills/no-go-discipline/SKILL.md
    scope_tag: audit_physics_process
    values:
      partial_attempt_with_named_untested_routes:
        definition: "Records the tested work while naming alternative routes that remain untested."
      partial_narrowing:
        definition: "Narrows the claim to the portion actually supported by the restricted packet."
      bounded_with_corrected_wall_count:
        definition: "Retains only the bounded wall set that survives the independence audit."
      stretch_attempt_with_honest_residual:
        definition: "Preserves a useful stretch attempt while stating the unresolved residual explicitly."

  independence:
    description: "Adversarial-review independence tier between auditor and author. auditor ≠ author required."
    authority: docs/audit/FRESH_LOOK_REQUIREMENTS.md
    scope_tag: audit_physics_process
    values:
      weak:
        definition: "Same model family, or session whose context restrictions cannot be established. Permitted for diagnostic review; not eligible to land audited_clean."
      fresh_context:
        definition: "Same model family, different auditor/session identity, restricted-input audit. Same-family clean-room tier for detecting context poisoning without claiming cross-family review."
      cross_family:
        definition: "Different model family from the author. Default cross-family auditor for this repo: best available full Codex GPT model at maximum reasoning."
      strong:
        definition: "Human reviewer with no prior involvement in the note."
      external:
        definition: "Off-repo reviewer with no project context. Only tier satisfying external-impact requirements; the audit lane does not produce these on its own."
      judicial_review:
        definition: "Third-auditor pass ratifying first or second audit on a cross-confirmation disagreement."

  load_bearing_step_class:
    description: "The kind of step the load-bearing sentence or equation is. Determines the verdict gate."
    authority: docs/audit/AUDIT_AGENT_PROMPT_TEMPLATE.md
    scope_tag: audit_physics_process
    values:
      "(A)":
        definition: "Algebraic identity check on existing inputs."
      "(B)":
        definition: "Cross-note input verification (reads value from another note)."
      "(C)":
        definition: "First-principles compute from the approved premise surface (Lattice, Qubit, Admissibility, Record, plus any explicitly approved primitive when cited) producing a number not present in any input."
      "(D)":
        definition: "External comparator check against PDG / lattice QCD / observation."
      "(E)":
        definition: "Definition (introduces a new symbol). Triggers audited_renaming."
      "(F)":
        definition: "Renaming (asserts symbol identity between two existing concepts). Triggers audited_renaming."
      "(G)":
        definition: "Numerical match at a tuned input scale. Triggers audited_numerical_match."

  prose_status:
    description: "Vocabulary compliance of the source note. Separate from audit_status (physics)."
    authority: docs/repo/VOCABULARY_HYGIENE_DESIGN.md
    scope_tag: core_process
    values:
      clean:
        definition: "No vocabulary drift detected by vocab_lint."
      auto_corrected:
        definition: "Routine drift mechanically rewritten by vocab_lint --fix; rewrites logged in prose_corrections."
      needs_human_vocab_decision:
        definition: "Genuinely new term that vocab_lint cannot mechanically rewrite; queued for vocab-extension review."
      not_evaluated_pre_vocab_lint:
        definition: "Pre-Cleanup-1 row, newly seeded row, or source-drift row not yet linted under the new rules. Seeder/backfill default."
      queue_backpressure_exceeded:
        definition: "Vocab-extension review queue is >50 entries deep; new unresolved terms emit this until queue is processed."

  prose_corrections:
    description: "List of (rule_id, before, after) tuples recording mechanical rewrites applied during the same audit cycle."
    authority: docs/repo/VOCABULARY_HYGIENE_DESIGN.md
    scope_tag: core_process
    shape: "list[{rule_id: str, before: str, after: str | null}]"

# ---------------------------------------------------------------------------
# Valid (audit_status, prose_status) combinations
# ---------------------------------------------------------------------------
# A non-clean prose_status never demotes a physics verdict. A non-clean
# audit_status is never set by vocabulary drift alone. The two axes are
# orthogonal; vocab_lint records prose_status independent of the auditor's
# physics verdict.
valid_audit_prose_combinations:
  audited_clean:        [clean, auto_corrected, needs_human_vocab_decision, queue_backpressure_exceeded]
  audited_conditional:  [clean, auto_corrected, needs_human_vocab_decision, queue_backpressure_exceeded]
  audited_renaming:     [clean, auto_corrected, needs_human_vocab_decision, queue_backpressure_exceeded]
  audited_decoration:   [clean, auto_corrected, needs_human_vocab_decision, queue_backpressure_exceeded]
  audited_numerical_match: [clean, auto_corrected, needs_human_vocab_decision, queue_backpressure_exceeded]
  audited_failed:       [clean, auto_corrected, needs_human_vocab_decision, queue_backpressure_exceeded]
  unaudited:            [clean, auto_corrected, needs_human_vocab_decision, not_evaluated_pre_vocab_lint, queue_backpressure_exceeded]
  audit_in_progress:    [clean, auto_corrected, needs_human_vocab_decision, queue_backpressure_exceeded]

# ---------------------------------------------------------------------------
# Filename rules
# ---------------------------------------------------------------------------
filename_rules:
  meta_note_suffix: "_NOTE_<YYYY-MM-DD>.md"
  forbidden_suffixes:
    # Count = instances on main as of 2026-05-18 sweep. Cleanup-2 migrates them.
    - {suffix: "_HOSTILE_AUDIT_FINDINGS_NOTE_", count: 84}
    - {suffix: "_STRETCH_ATTEMPT_NOTE_",        count: 16}
    - {suffix: "_DOWNSTREAM_FIX_NOTE_",         count: 9}
    - {suffix: "_HOSTILE_REVIEW_",              count: 7}
    - {suffix: "_REVIEW_PACKET_",               count: 5}
    - {suffix: "_TERMINAL_SYNTHESIS_META_",     count: 4}
    - {suffix: "_SHARPENED_NOTE_",              count: 4}
    - {suffix: "_FIX_RECORD_",                  count: 0}
    - {suffix: "_FINDINGS_MEMO_",               count: 0}
    - {suffix: "_ADDENDUM_",                    count: 0}
    - {suffix: "_SURGICAL_REPAIR_",             count: 0}
    - {suffix: "_AUDIT_BRIEF_",                 count: 0}
    - {suffix: "_FRAMING_FIX_NOTE_",            count: 1}
    - {suffix: "_ROUTING_CORRECTION_NOTE_",     count: 1}
    - {suffix: "_OBJECTION_CLOSURE_NOTE_",      count: 1}
    - {suffix: "_CAMPAIGN_PROGRESS_SYNTHESIS_", count: 1}

# ---------------------------------------------------------------------------
# Rewrite rules (used by vocab_lint --fix)
# ---------------------------------------------------------------------------
# Each rule applies a mechanical text or filename transformation. Patterns
# are Python regular expressions. `replacement` uses backreferences via $N.
# `requires_link_aware_rewrite: true` rules must also rewrite cross-doc
# references atomically; Cleanup-1 only reports them, and Cleanup-2 adds the
# link-aware rewrite implementation.
# `migration_strategy: per_file_mapping_with_link_check` rules require an
# explicit per-file mapping built before the rewrite (e.g. F-letter → Finding-N).
rewrite_rules:
  - id: legacy_alias_strip
    pattern: '\s*\(legacy alias:\s*[A-Z][0-9A-Z]*\)'
    replacement: ""
    rationale: "Aliasing creates rot. Use the canonical name only."
    excluded_paths:
      - "docs/work_history/**"
      - "archive_unlanded/**"
      # The vocab governance docs describe the pattern they forbid; they
      # must be allowed to quote example aliases without being rewritten.
      - "docs/repo/VOCABULARY_HYGIENE_DESIGN.md"
      - "docs/repo/VOCABULARY_HYGIENE_REVIEW_2026-05-18.md"
      - "docs/repo/CONTROLLED_VOCABULARY.md"
      - "docs/repo/controlled_vocabulary.yaml"
      - "docs/KEY_TERMINOLOGY.md"
      - "docs/audit/README.md"
      - "scripts/vocab_lint.py"

  - id: hostile_audit_findings_suffix
    pattern: '_HOSTILE_AUDIT_FINDINGS_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "New filename suffixes for meta notes are forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: downstream_fix_suffix
    pattern: '_DOWNSTREAM_FIX_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Same as above."
    requires_link_aware_rewrite: true

  - id: stretch_attempt_suffix
    pattern: '_STRETCH_ATTEMPT_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Stretch-attempt suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: hostile_review_suffix
    pattern: '_HOSTILE_REVIEW_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Hostile-review suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: review_packet_suffix
    pattern: '_REVIEW_PACKET_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Review-packet suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: terminal_synthesis_meta_suffix
    pattern: '_TERMINAL_SYNTHESIS_META_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Terminal-synthesis-meta suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: sharpened_note_suffix
    pattern: '_SHARPENED_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Sharpened-note suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: collapse_doubled_note
    # Collapses ..._NOTE_NOTE_<date>.md (which results when the upstream
    # filename already ended in _NOTE_ before the forbidden suffix) to
    # ..._NOTE_<date>.md. Run after the suffix-strip rules.
    pattern: '_NOTE_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Collapse doubled _NOTE_ suffix produced by suffix-strip on filenames already ending in _NOTE_."
    requires_link_aware_rewrite: true

  - id: terminal_synthesis_meta_note_suffix
    pattern: '_TERMINAL_SYNTHESIS_META_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Terminal-synthesis-meta suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: sharpened_note_trailing_id_suffix
    # _SHARPENED_NOTE_<date>_<trailing-id>.md -> _NOTE_<date>_<trailing-id>.md
    # Catches files with a trailing identifier after the date (e.g. _probe24).
    pattern: '_SHARPENED_NOTE_(\d{4}-\d{2}-\d{2})_([a-zA-Z0-9]+)\.md'
    replacement: '_NOTE_$1_$2.md'
    rationale: "Sharpened-note suffix forbidden; preserve trailing id after the date."
    requires_link_aware_rewrite: true

  - id: framing_fix_note_suffix
    pattern: '_FRAMING_FIX_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Framing-fix-note suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: routing_correction_note_suffix
    pattern: '_ROUTING_CORRECTION_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Routing-correction-note suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: objection_closure_note_suffix
    pattern: '_OBJECTION_CLOSURE_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Objection-closure-note suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: campaign_progress_synthesis_suffix
    pattern: '_CAMPAIGN_PROGRESS_SYNTHESIS_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Campaign-progress-synthesis suffix forbidden; use plain _NOTE_<date>.md."
    requires_link_aware_rewrite: true

  - id: stretch_attempt_doubled_note_suffix
    # Catches the COMPOSITE_HIGGS-style double-suffix that survived
    # Cleanup-2 (_STRETCH_ATTEMPT_NOTE_<date1>_NOTE_<date2>.md). Keeps
    # the later date.
    pattern: '_STRETCH_ATTEMPT_NOTE_\d{4}-\d{2}-\d{2}_NOTE_(\d{4}-\d{2}-\d{2})\.md'
    replacement: '_NOTE_$1.md'
    rationale: "Doubled stretch-attempt suffix; keep the later date as the canonical note date."
    requires_link_aware_rewrite: true

  - id: hostile_review_token
    # Token-level removal: _HOSTILE_REVIEW_ as a middle-token, not only
    # as a trailing suffix. Replaces with _REVIEW_ to preserve the
    # meaningful review token while dropping the forbidden qualifier.
    pattern: '_HOSTILE_REVIEW_'
    replacement: '_REVIEW_'
    rationale: "Drop forbidden HOSTILE_ qualifier from filenames; preserve REVIEW token."
    requires_link_aware_rewrite: true

  - id: f_letter_heading
    # NOT a one-shot regex. F-letter migration requires per-file mapping
    # {F-A: <title>, F-B: <title>, ...} → {Finding 1: <title>, ...} with
    # link-aware cross-doc reference updates.
    migration_strategy: per_file_mapping_with_link_check
    rationale: "F-letter codes are forbidden; descriptive numbered findings replace them."

# ---------------------------------------------------------------------------
# Deferred forbidden patterns
# ---------------------------------------------------------------------------
# Cleanup-1 records these as controlled-vocabulary policy, but the first
# linter pass intentionally enforces only mechanical rewrite rules and
# forbidden filename suffixes. These structured checks become reportable after
# Cleanup-1b/Cleanup-2 adds the renderer and link-aware sweep.
forbidden_patterns:
  - id: physics_primitive_in_vocab_doc
    description: "Framework primitives (Cl(3), Z^3, A_min, Axiom N, etc.) appearing in CV.md or KEY_TERMINOLOGY.md."
    applies_to: [docs/repo/CONTROLLED_VOCABULARY.md, docs/KEY_TERMINOLOGY.md]
    pattern: '\b(Cl\(3\)|Z\^?3|A_?min|Axiom\s*[0-9]+)\b'
  - id: audit_verdict_conflates_physics_with_prose
    description: "Setting audited_renaming / audited_conditional purely on prose grounds."
    applies_to: [docs/audit/data/audit_ledger.json]
    pattern: "<requires structured review; not a one-shot regex>"
  - id: paraphrased_index_drift
    description: "Manual edits to CV.md or KEY_TERMINOLOGY.md after Cleanup-1b (when those become generated products of this YAML)."
    applies_to: [docs/repo/CONTROLLED_VOCABULARY.md, docs/KEY_TERMINOLOGY.md]
    note: "Activated when Cleanup-1b lands the renderer + generated-header check."

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
scope:
  in_scope:
    - "Process labels (audit_status, prose_status, repair_class, independence, load_bearing_step_class, etc.)"
    - "Filename conventions"
    - "Forbidden patterns"
  out_of_scope:
    - "Framework axioms and approved primitive premise nodes (live in MINIMAL_AXIOMS_2026-06-29.md and docs/audit/data/axiom_premise_nodes.json)"
    - "Physics quantities (live in ASSUMPTION_DERIVATION_LEDGER / per-claim notes)"
    - "Topic-specific physics wording (lives in topic notes; not vocabulary)"

# ---------------------------------------------------------------------------
# Publication-capture dispositions
# ---------------------------------------------------------------------------
# Used on publication-control-plane surfaces such as PUBLICATION_MATRIX.md.
publication_capture_dispositions:
  use_context: "Publication-control-plane surfaces such as `PUBLICATION_MATRIX.md`."
  labels:
    - {label: retained,    use: "live retained family on the current paper-authority surface"}
    - {label: promoted,    use: "main-paper publication-core family carried directly in the current paper package"}
    - {label: bounded,     use: "live captured family kept outside the main paper core with explicit caveats"}
    - {label: open,        use: "live gate / blocker that is not yet closed"}
    - {label: frozen-out,  use: "intentionally excluded from the main paper while still recorded"}
  footnote: "These are package-capture decisions, not generic adjectives."

# ---------------------------------------------------------------------------
# Claim-strength / release labels
# ---------------------------------------------------------------------------
claim_strength_labels:
  use_context: "Notes, claims tables, quantitative tables, and runner summaries."
  labels:
    - {label: retained, use: "theorem-grade closure on the retained authority surface"}
    - {label: derived, use: "current-main downstream result obtained from retained structure plus named bridge/import assumptions; safe to quote, but not the same as zero-input retained closure"}
    - {label: retained corollary, use: "safe retained consequence of a retained theorem/action surface"}
    - {label: "retained support theorem / retained support", use: "exact retained support result that is reusable but not itself the manuscript headline"}
    - {label: retained support batch, use: "coherent retained batch of support theorems/tools carried together for atlas, reviewer, or support-package reuse"}
    - {label: "retained exact theorem / retained exact companion", use: "exact retained theorem/companion variant used when exactness itself is part of the safe statement"}
    - {label: "retained structural theorem / retained exact structural theorem", use: "retained exact structural law on the framework/package surface"}
    - {label: retained support tool, use: "reusable retained tool/subderivation that supports other lanes without itself being the manuscript headline"}
    - {label: "retained framework statement / retained positioning / retained quantitative lane", use: "retained package-authority framing labels for front-door/control-plane use"}
    - {label: "retained action-surface closure / retained restricted theorem / retained restricted support / retained evaluated theorem", use: "retained exact-result variants where the constrained surface/class/evaluation matters"}
    - {label: "retained positive / retained partial positive", use: "retained positive lane result used mainly on atlas/toolbox surfaces rather than as the headline theorem"}
    - {label: "exact support theorem / exact support", use: "accepted exact-support variant when exactness itself is material to the safe statement; use with the same non-headline semantics as retained support, and keep bridge/import qualifiers explicit"}
    - {label: exact support batch, use: "coherent exact batch of support theorems/tools carried together for atlas or reviewer reuse"}
    - {label: "exact structural theorem / exact algebraic identity / exact subderivation", use: "accepted exact-result specializations for atlas / theorem-bank rows when the mathematical role matters"}
    - {label: "exact boundary theorem / exact reduction theorem", use: "accepted exact-result specializations for atlas / theorem-bank rows when the mathematical role is an open-lane boundary or a compression/reduction statement"}
    - {label: "exact current-stack theorem / exact current-bank theorem / exact current-bank reduction / exact current-bank no-go theorem", use: "accepted exact-result specializations for current-stack/current-bank closeout rows on atlas and reviewer surfaces"}
    - {label: "exact negative boundary / exact negative closeout / exact post-selector reduction", use: "accepted exact-result specializations for explicit no-go/closeout/post-selector roles on atlas and reviewer surfaces"}
    - {label: exact support/boundary theorem, use: "accepted mixed exact-role label when a row simultaneously contributes a reusable exact support input and an exact open-lane boundary statement"}
    - {label: exact support tool, use: "reusable exact tool/subderivation that supports other lanes without being the headline claim"}
    - {label: "bounded support theorem / bounded support note / bounded support tool", use: "bounded supporting result/tool carried for atlas, reviewer, or secondary-lane use; not a main closure claim"}
    - {label: bounded support batch, use: "coherent bounded batch of support tools/calculations carried for atlas or reviewer reuse"}
    - {label: promoted quantitative package, use: "quantitative package strong enough for the current main-paper surface"}
    - {label: bounded companion, use: "live bounded supporting lane outside the main paper core"}
    - {label: bounded secondary lane, use: "live bounded lane worth carrying, but clearly secondary to the main package"}
    - {label: "bounded frontier / bounded negative boundary / bounded Route 2 build candidate", use: "bounded frontier/result classes kept for ongoing design work rather than current-package promotion"}
    - {label: main closure package, use: "package-level main-paper closure claim on the current review/package surface; stronger than support, but not automatically the retained quantitative paper core"}
    - {label: conditional / support, use: "useful positive package whose load-bearing step is still conditional, imposed, or support-only"}
    - {label: open main gate, use: "still-open main closure target"}
    - {label: historical / diagnostic, use: "preserved for audit/history/instrumentation, not live evidence"}
    - {label: "historical support / provenance / exact transport provenance", use: "provenance-only rows kept for route history, reviewer handoff, or closure bookkeeping rather than live promotion"}
    - {label: negative-result, use: "useful negative or no-go result"}
    - {label: negative-result / support, use: "negative/no-go result that is also a reusable support/pruning surface"}
    - {label: inconclusive, use: "signal exists but interpretation is not frozen"}
  allowed_composite_forms_intro: "Allowed composite forms should be built from the labels above and kept narrow:"
  allowed_composite_forms:
    - retained exact theorem
    - retained exact companion
    - retained structural theorem
    - retained exact structural theorem
    - retained corollary
    - retained support theorem
    - retained support batch
    - retained support tool
    - exact support theorem
    - exact support batch
    - exact structural theorem
    - exact algebraic identity
    - exact subderivation
    - exact boundary theorem
    - exact reduction theorem
    - exact current-stack theorem
    - exact current-bank theorem
    - exact current-bank reduction
    - exact current-bank no-go theorem
    - exact negative boundary
    - exact negative closeout
    - exact post-selector reduction
    - exact support/boundary theorem
    - exact support tool
    - bounded support theorem
    - bounded support note
    - bounded support tool
    - bounded support batch
    - bounded companion prediction
    - bounded frontier
    - bounded negative boundary
    - bounded Route 2 build candidate
    - main closure package
    - promoted quantitative package
    - open main gate
  allowed_composite_forms_footnote: "Avoid minting new slash-composites when a nearby qualifier/import column can carry the caveat instead."
  role_specialized_variants_intro: |-
    Role-specialized variants are acceptable when the cell begins with one of the
    accepted base labels above and the trailing noun names the mathematical role
    or control-plane role of the row, for example:
  role_specialized_variants:
    - retained framework statement
    - retained quantitative lane
    - retained action-surface closure
    - retained restricted theorem
    - exact structural theorem
    - exact algebraic identity
    - exact subderivation
    - retained support tool
    - retained support batch
    - exact support tool
    - exact support batch
    - exact boundary theorem
    - exact reduction theorem
    - exact current-stack theorem
    - exact current-bank theorem
    - exact current-bank no-go theorem
    - exact negative boundary
    - exact negative closeout
    - exact post-selector reduction
    - historical support / provenance
  scope_qualifier_intro: |-
    Do not mix a publication-capture disposition with a claim-strength label in
    the same cell unless the file explicitly allows hybrid narrative decisions.

    Short scope qualifiers may follow an accepted label when they state where the
    claim lives, for example:
  scope_qualifier_examples:
    - exact boundary theorem on open gate
    - exact reduction theorem outside main core
    - exact support theorem on the bounded charged-lepton package
    - exact support theorem with bounded downstream reuse
    - retained support theorem on the current package surface
  review_adjective_warning: |-
    Do not use `reviewed` or `reviewer-tested` as status labels. Those are review
    process adjectives, not controlled-vocabulary claim-strength labels. Carry
    review context in prose, placement, or authority notes instead.

# ---------------------------------------------------------------------------
# Migration / legacy wording (proposed_*)
# ---------------------------------------------------------------------------
migration_legacy_wording:
  intro: |-
    The repo is migrating from author-declared `retained` / `promoted`
    language to the audit-lane propose / ratify vocabulary. Source-note
    `Status` lines now use:
  values:
    - {label: proposed_retained, definition: "author proposes retained-grade; awaits audit ratification"}
    - {label: proposed_promoted, definition: "author proposes promoted-grade; awaits audit ratification"}
  ratified_surface_pointer: |-
    The canonical audit-ratified surface is
    [docs/audit/AUDIT_LEDGER.md](../audit/AUDIT_LEDGER.md). Legacy
    publication summaries may still use manuscript shorthand, but those rows
    should be read as proposed until the audit ledger marks them clean.
  new_note_rule: |-
    New notes must use `proposed_retained` / `proposed_promoted` on author
    side and rely on the pipeline's `effective_status` for the
    publication-facing label. Do not bare-declare `retained` on a source
    note.

# ---------------------------------------------------------------------------
# Historical lane-board labels
# ---------------------------------------------------------------------------
historical_lane_board_labels:
  use_context: "Historical repo-map surfaces such as `LANE_STATUS_BOARD.md` and the lane registry."
  labels:
    - {label: primary-retained,    use: "current best-supported lane in the historical lane-board sense"}
    - {label: retained-companion,  use: "real, replayable companion lane, but not the single default entrypoint"}
    - {label: open-blocker,        use: "active blocker limiting the historical lane claim boundary"}
    - {label: exploratory-reopen,  use: "partially positive lane worth more work, but not promoted"}
    - {label: historical-control,  use: "historical comparison/control lane"}
    - {label: historical-retained, use: "older retained major program, no longer the default"}
    - {label: historical-bounded,  use: "scientifically useful historical work, no longer the lead lane"}
    - {label: historical-blocked,  use: "diagnosed dead-end or mechanism-level blocker"}

# ---------------------------------------------------------------------------
# Historical discovery-log labels
# ---------------------------------------------------------------------------
historical_discovery_log_labels:
  use_context: "Historical discovery / paper-seed ledgers such as `POTENTIAL_PUBLICATION_DISCOVERIES_LOG.md`."
  labels:
    - {label: retained,          use: "historically important retained discovery"}
    - {label: bounded-retained,  use: "bounded positive result preserved on `main`, worth paper planning, but not a retained theorem-grade closure"}
    - {label: methodological,    use: "important measurement / methodology / audit contribution"}
    - {label: negative-result,   use: "strong structural no-go or narrowing result"}
    - {label: exploratory-lead,  use: "quantitatively interesting lead worth preserving, not yet frozen"}

# ---------------------------------------------------------------------------
# Column rules (per-file vocabulary discipline)
# ---------------------------------------------------------------------------
column_rules:
  files:
    - file: PUBLICATION_MATRIX.md
      rules:
        - "use publication-capture dispositions for capture decisions"
        - "`Current publication decision` cells should begin with one of `retained`, `promoted`, `bounded`, `open`, `frozen-out`; a short placement note may follow after a semicolon"
    - file: "CLAIMS_TABLE.md, QUANTITATIVE_SUMMARY_TABLE.md, DERIVATION_ATLAS.md"
      rules:
        - "use claim-strength / release labels"
        - "accepted role-specialized variants may be used when they begin with the primary claim-strength label"
    - file: FULL_CLAIM_LEDGER.md
      rules:
        - "may begin with either a publication-capture disposition or a claim-strength label because it narrates package decisions row-by-row"
        - "avoid ad hoc hybrids; if a row begins with one family, keep any second-family qualifier short and explanatory"
        - "on mixed audit rows, the cell should begin with the primary label from the family being used; a short explanatory qualifier may follow after a semicolon"
        - "accepted ledger-style hybrids include forms such as `promoted exact companion`, `promoted restricted theorem`, `promoted retained closure`, `promoted retained support batch`, and `promoted retained action-surface closure`"
    - file: "docs/audit/AUDIT_LEDGER.md, docs/audit/data/audit_ledger.json"
      rules:
        - "use audit-lane field vocabulary only"
        - "rows are written by the audit pipeline / `apply_audit.py`; do not hand-edit"
    - file: LANE_STATUS_BOARD.md
      rules:
        - "use historical lane-board labels"
    - file: POTENTIAL_PUBLICATION_DISCOVERIES_LOG.md
      rules:
        - "use historical discovery-log labels"
  footnote: "Do not use row prose like `Retained ...` when the row status is `bounded-retained`."

# ---------------------------------------------------------------------------
# Protocol qualifiers
# ---------------------------------------------------------------------------
protocol_qualifiers:
  intro: "These are qualifiers, not standalone status labels:"
  values: [review surface, current package grade, strict/native map, exact-target strict/native map]
  footnote: "They can appear in prose or qualifier/import columns, but they should not replace the primary status label."

# ---------------------------------------------------------------------------
# Evidence terms
# ---------------------------------------------------------------------------
evidence_terms:
  intro: "Prefer these nouns:"
  preferred:
    - {term: protocol, definition: "a specific constructed experimental/computational setup"}
    - {term: witness, definition: "a bounded positive signal on a stated protocol"}
    - {term: diagnostic, definition: "an instrument/readout used for triage or debugging"}
    - {term: companion, definition: "a bounded supporting lane attached to a stronger package"}
    - {term: closure, definition: "use only when the load-bearing claim is actually closed"}
  avoid_intro: "Avoid vague upgrades like:"
  avoid:
    - {term: proof, context: "when the surface is only a witness or protocol"}
    - {term: closure, context: "when the status is really `bounded-retained` or `conditional / support`"}

# ---------------------------------------------------------------------------
# Hyphenation
# ---------------------------------------------------------------------------
hyphenation_rules:
  - prefer: "observational-pin as a compound adjective"
  - prefer: "observational pin only as a noun phrase"

# ---------------------------------------------------------------------------
# Stale-narrative archival
# ---------------------------------------------------------------------------
stale_narrative_archival:
  intro: |-
    When a wrapper note's narrative frame fails an audit, archival uses
    fixed path and content vocabulary.
  archive_path:
    pattern: "archive_unlanded/<cluster-tag>/"
    description: "the canonical recovery surface for failed-narrative source notes."
    cluster_tag_examples: [koide-q-v6-cluster, route-2-exhaustion-failed-cluster]
    cluster_tag_note: "The cluster-tag is a short stable noun phrase for the wrapper cluster."
  salvage_note_required_content:
    intro: |-
      When a wrapper note fails but some sub-observations survive, the salvage
      note must state:
    must_state:
      - "what failed (the wrapper's load-bearing claim that the audit invalidated)"
      - "what survived (the durable structural observations that remain)"
      - "the source wrapper's archive recovery path"
    must_not: "restate the failed global conclusion"
  banned_wording:
    - phrase: '"deprecated" or "obsolete"'
      reason: "imply a deliberate retirement decision; `audit_status: audited_failed` is the canonical record, no additional adjective needed"
    - phrase: '"still useful"'
      reason: "unless the sentence also states exactly for what it is still useful"
  workflow_pointer: |-
    The associated workflow rules live in
    `docs/audit/STALE_NARRATIVE_POLICY.md`. Vocabulary lives here.

# ---------------------------------------------------------------------------
# Topic-local language (BMV / boundary-law / historical-retirement)
# Cleanup-2 moves these out of CV.md into per-topic notes.
# ---------------------------------------------------------------------------
topic_local_language:
  - id: bmv
    heading: "Branch-Entanglement / BMV Language"
    body: |-
      Preferred terms for the current staggered branch-entanglement lane:

      - `branch-mediated entanglement`
      - `externally imposed geometry/source-branch protocol`
      - `fixed-adjacency two-branch protocol`
      - `branch-mediated entanglement witness`

      Only call something a `BMV witness` when the surface closes the stronger
      mediator-side requirements, including:

      - branch/mediator structure is generated by the relevant physical degrees of
        freedom, not inserted externally
      - the mediator-null / LOCC-exclusion logic is implemented at the claimed level

      For the current live branch-entanglement package, say explicitly:

      - `not a self-generated mediator-branch BMV witness`
      - `not a mediator-null / LOCC-exclusion closure`

      Avoid as the primary descriptor on live package surfaces:

      - `toy`
      - `toy model`
      - `toy witness`
      - `BMV-like evidence`

      Those are acceptable only in historical commentary where the sentence also says
      what the protocol is missing.
  - id: boundary_law
    heading: "Boundary-Law Language"
    body: |-
      For the live boundary-law lane, prefer:

      - `Dirac-sea boundary-law probe`
      - `many-body-style boundary-law result`
      - `bounded boundary-law package`

      Avoid calling historical transfer-entropy scripts:

      - `area law`
      - `subsystem entanglement measurement`

      unless the measured object actually matches that wording.
  - id: historical_retirement
    heading: "Historical Retirement Language"
    body: |-
      When an old runner is no longer live evidence, prefer:

      - `retired as evidence`
      - `historical / diagnostic`
      - `historical exploratory predecessor`

      Avoid ambiguous phrasing like:

      - `still useful`

      unless the sentence also states exactly for what it is still useful.

# ---------------------------------------------------------------------------
# Paper-facing prose voice
# ---------------------------------------------------------------------------
paper_voice:
  intro: |-
    The target voice for paper-facing prose, curated methodology prose, repo
    instructions, and new synthesis is Feynman-like in the useful sense:
    plain, physical, concrete, curious, and hard to fool. Do not imitate
    quirks or make the prose performative. Use the attitude.

    Do not rewrite raw captures or historical dated notes just to polish the
    voice; those files are evidence of the work as it happened.
  rule: |-
    Explain what we are doing as if the reader is smart, skeptical, and busy.

    Say the simple physical question first. Then say what was checked. Then say
    what did not close.
  use_this:
    - "Start from the physical question, not from the institutional framing."
    - "Prefer short sentences when the idea is hard."
    - "Explain why a result is surprising or useful in ordinary language before listing the machinery."
    - "Put equations after the idea they express."
    - 'Say "we find", "we check", "we keep", and "we do not claim" when those are the honest verbs.'
    - "Treat negative results as information."
    - "Keep the reader close to the object: lattice, operator, runner, eigenvalue, projector, source, bridge."
  avoid_this:
    - '"broad exact backbone"'
    - '"methodological innovation"'
    - '"transformative framework"'
    - '"groundbreaking result"'
    - '"paradigm"'
    - '"comprehensive package" unless the sentence immediately says what is inside'
    - '"already closed" without naming the exact surface'
    - "any sentence whose main job is to sound important"
  decoration_pruning_tone: |-
    When pruning algebraic decoration, the tone is "claim-surface management",
    not "criticism of the algebra itself". The identities are real; what's
    being pruned is the count of separately-retained rows. A package that
    presents 25 separate retained theorems where 3 distinct claims exist is
    harder to review, harder to falsify, and harder to take seriously as an
    external reader. Pruning improves signal density of the publication
    package. Use that framing in prose.
  paragraph_test_intro: "For each paragraph, ask:"
  paragraph_test:
    - "What is the question?"
    - "What is the object being calculated?"
    - "What is the support surface?"
    - "What is still open?"
  paragraph_test_footnote: |-
    If the paragraph does not answer at least one of these, cut it or move
    it to a ledger.

# ---------------------------------------------------------------------------
# Schema invariants enforced by audit_lint.py / apply_audit.py / vocab_lint.py
# ---------------------------------------------------------------------------
invariants:
  - id: physics_prose_orthogonal
    description: "prose_status does NOT propagate into effective_status. A non-clean prose_status cannot demote a physics-clean row; a clean prose_status cannot promote a physics-non-clean row."
    enforced_by: [docs/audit/scripts/compute_effective_status.py, docs/audit/scripts/audit_lint.py]
  - id: audit_status_unchanged
    description: "The 8-value audit_status enum is physics-native and unchanged from audit/README.md. This vocabulary file mirrors it; it does not redefine it."
    enforced_by: [docs/audit/scripts/apply_audit.py, docs/audit/scripts/audit_lint.py]
  - id: pre_audit_prose_fix_atomic
    description: "When vocab_lint --fix changes a note's content, the resulting note_hash refresh must happen atomically with the prose_status / prose_corrections write. apply_audit.py accepts a pre_audit_prose_fix envelope for this."
    enforced_by: [docs/audit/scripts/apply_audit.py]
